{% extends "base.html" %}

{% block content %}
<style>
    .home-page {
        margin: 0;
        background: #f8fafc;
        color: #405064;
        font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .home-page .app-header {
        box-sizing: border-box;
        position: relative;
        height: 70px;
        padding: 0 max(7vw, 24px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2859aa;
        color: #fff;
    }

    .home-page .app-header h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: .04em;
    }

    .home-page .menu-button {
        border: 0;
        padding: 0;
        background: transparent;
        color: #fff;
        font-size: 29px;
        line-height: 1;
        cursor: pointer;
    }

    .home-page .app-nav {
        display: none;
        position: absolute;
        z-index: 1000;
        top: 70px;
        right: max(7vw, 24px);
        width: 220px;
        padding: 8px;
        flex-direction: column;
        gap: 2px;
        border: 1px solid #e3eaf3;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(38, 71, 111, .18);
    }

    .home-page .app-nav.is-open {
        display: flex;
    }

    .home-page .app-nav a,
    .home-page .nav-status {
        box-sizing: border-box;
        display: block;
        width: 100%;
        padding: 11px 14px;
        border-radius: 6px;
        color: #2859aa;
        font-size: 15px;
        text-decoration: none;
    }

    .home-page .app-nav a:hover {
        background: #edf4ff;
    }

    .home-page .nav-status {
        color: #667487;
        font-size: 13px;
    }

    .home-page main {
        width: min(910px, 57.1vw);
        margin: 32px auto 86px;
    }

    .home-page .home-card {
        box-sizing: border-box;
        margin-bottom: 34px;
        padding: 28px;
        border: 1px solid #f0f3f7;
        border-radius: 17px;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 8px 25px rgba(38, 71, 111, .08);
    }

    .home-page h2 {
        margin: 0 0 20px;
        color: #2859aa;
        font-size: 24px;
        line-height: 1.35;
    }

    .home-page .section-icon {
        margin-right: 7px;
    }

    .home-page #shelterMap {
        width: 100%;
        height: auto;
        aspect-ratio: 855 / 365;
        border-radius: 11px;
        overflow: hidden;
    }

    .home-page .weather-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .home-page .refresh-label {
        color: #2ca351;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
    }

    .home-page #weatherContent {
        box-sizing: border-box;
        min-height: 142px;
        padding: 19px;
        border-radius: 11px;
        background: #f7f8fa;
    }

    .home-page #weatherContent p {
        margin: 0 0 10px;
        font-size: 15px;
    }

    .home-page #weatherContent p:last-child {
        margin-bottom: 0;
    }

    .home-page .weather-location {
        font-weight: 700;
    }

    .home-page .weather-clear {
        color: #22984c;
        font-weight: 700;
    }

    .home-page .check-mark {
        display: inline-flex;
        width: 19px;
        height: 19px;
        align-items: center;
        justify-content: center;
        margin-right: 5px;
        border-radius: 50%;
        background: #2ca351;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
    }

    .home-page .weather-meta {
        color: #5c6978;
    }

    @media (max-width: 640px) {
        .home-page .app-header {
            height: 62px;
            padding: 0 20px;
        }

        .home-page .app-nav {
            top: 62px;
            right: 20px;
        }

        .home-page .app-header h1 {
            font-size: 21px;
        }

        .home-page main {
            width: calc(100% - 24px);
            margin-top: 18px;
        }

        .home-page .home-card {
            margin-bottom: 20px;
            padding: 17px;
            border-radius: 13px;
        }

        .home-page h2 {
            font-size: 20px;
        }

        .home-page #shelterMap {
            height: 285px;
            aspect-ratio: auto;
        }

        .home-page .weather-heading {
            align-items: flex-start;
            flex-direction: column;
            gap: 4px;
        }
    }
</style>

<section class="home-card">
    <h2><span class="section-icon" aria-hidden="true">📍</span>避難所マップ</h2>
    <div id="shelterMap"></div>
</section>

<section class="home-card">
    <div class="weather-heading">
        <h2><span class="section-icon" aria-hidden="true">🌤️</span>青森市 気象警報・注意報</h2>
        <span class="refresh-label">↻ 10分おき自動更新</span>
    </div>
    <div id="weatherContent">
        <p>読み込み中...</p>
    </div>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => updateWeatherContent(data))
            .catch(error => console.error('気象情報の更新に失敗しました:', error));
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');
        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-warnings">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-clear"><span class="check-mark">✓</span>現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">◒ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
